// P0 candidate profile - NOT qualified.
// Copy next to the isolated client's Scripts/ and pass it as the ONLY
// startup script (`+script Scripts/<name>.ini`). Every switch is explicit:
// a forgotten bot_bEnabled turns the run into "idle client with four players"
// and the telemetry file then reports reason=DISABLED.

bot_bEnabled = 1;
bot_fYawSpeed = 45.0;
bot_fMoveFactor = 1.0;
bot_fFirePeriod = 1.0;
bot_iFireTicks = 3;
bot_iLogEvery = 40;
bot_bDiagnostics = 0;
bot_bAutoCombat = 1;
bot_bObstacleAvoidance = 1;
bot_bCombatSkipLocals = 1;

// P0 evidence: one CSV row per second, no console spam.
bot_iTelemetry = 1;
bot_bNullRender = 1;   // skip GameRedrawView for bot frames
bot_bTelemetryConsole = 0;

// EXE-owned symbols (SeriousSam.exe), not declared by GameMP.
sam_iMaxFPSActive = 20;
sam_iMaxFPSInactive = 10;
sam_bPauseOnMinimize = 0;
