// init.ini - einmalige Grundkonfiguration des Dedicated Servers
// Ablage: <Server>\Scripts\Dedicated\BotTest\init.ini
// Start:  DedicatedServer.exe BotTest

ded_iMaxFPS = 100;            // Simulationsrate des Dedicated Servers
ded_bRestartWhenEmpty = 0;    // WICHTIG: Default ist TRUE (Runden-Reset bei Leerstand) - fuer Bot-Betrieb und Tests auf 0
ded_tmTimeout = -1;           // kein automatischer Runden-Timeout (-1 = aus)
