// Phase2FourBots.ini - Phase-2-Vollausbau: 4 lokale Bots in EINEM Bot-Client.
// Erst verwenden, wenn der 2-Bot-Smoke-Test (Phase2TwoBots.ini) PASS ist.
// Ablage: <Bot-Client>\Scripts\Phase2FourBots.ini
// Start:  SeriousSam.exe +connect <ip>:25600 +quickjoin +script Scripts\Phase2FourBots.ini
//
// VORAUSSETZUNG: 4 Spielerprofile (Index 0..3) mit eigenen Namen/GUIDs,
// z. B. TSE_Bot_A..TSE_Bot_D.

bot_bEnabled = 1;
bot_ctLocalPlayers = 4; // NET_MAXLOCALPLAYERS - Maximum pro Prozess
bot_iProfileBase = 0;   // Profile 0..3
bot_bVariants = 1;

bot_fYawSpeed = 45;
bot_fMoveFactor = 1.0;
bot_fFirePeriod = 1.0;
bot_iFireTicks = 3;
bot_iLogEvery = 20;
bot_bDiagnostics = 1;
