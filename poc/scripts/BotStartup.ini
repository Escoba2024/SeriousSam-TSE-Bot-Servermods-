// BotStartup.ini - Aktivierung des BotDriver (Pfad-D-PoC)
// Ablage: <Bot-Client>\Scripts\BotStartup.ini
// Ausfuehrung: SeriousSam.exe +connect <ip>:<port> +quickjoin +script Scripts\BotStartup.ini

bot_bEnabled = 1;      // Master-Schalter: BotDriver uebernimmt die Action-Erzeugung
bot_fYawSpeed = 45;    // Drehgeschwindigkeit in Grad pro Sekunde (0 = geradeaus)
bot_fMoveFactor = 1.0; // Anteil an plr_fSpeedForward (0..1)
bot_fFirePeriod = 1.0; // Feuerpuls-Periode in Sekunden (<=0 = nie feuern)
bot_iFireTicks = 3;    // Feuerpuls-Laenge in Ticks (20 Ticks = 1 Sekunde)
bot_iLogEvery = 40;    // Status-Log alle N Ticks (0 = aus); 40 = alle 2 s
