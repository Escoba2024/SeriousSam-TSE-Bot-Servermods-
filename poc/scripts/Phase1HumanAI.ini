// Phase1HumanAI.ini - profile-driven bot AI (unqualified candidate).
// Ablage: <Bot-Client>\Scripts\Phase1HumanAI.ini
// Start:  SeriousSam.exe +connect <ip>:<port> +quickjoin +script Scripts\Phase1HumanAI.ini
//
// Requires the GameMP build with patch 0008 applied and the five bot_*.h
// headers from poc/botcore/ next to BotDriver.cpp.
//
// This configuration is NOT native-verified. See
// docs/reports/2026-10-20-bot-ai-profiles-and-perception.md before use.

// --- driver core ---------------------------------------------------------
bot_bEnabled = 1;
bot_iLogEvery = 40;          // one status line every 2 s per local bot
bot_bDiagnostics = 0;

// --- automatic combat ----------------------------------------------------
bot_bAutoCombat = 1;
bot_iTestTarget = -1;        // -1 = normal deathmatch targeting
bot_bCombatSkipLocals = 0;   // the four local bots fight each other too
bot_bObstacleAvoidance = 1;  // reactive stuck recovery underneath the policy
bot_fMoveFactor = 1;         // full speed unless the policy says otherwise
bot_fYawSpeed = 45;          // legacy value, only used when bot_bHumanAI = 0

// --- profile-driven path -------------------------------------------------
bot_bHumanAI = 1;            // master switch for the new policy
bot_iRosterOffset = 0;       // client A: 0, client B: 4 (eight-bot roster)
// bot_iProfile0 = -1;        // -1 = rosterOffset + slot; override per slot:
// bot_iProfile0 = 0;         // e.g. force slot 0 to roster entry 0
// bot_iProfile1 = 1;
bot_iProfileSeed = 20261020; // mixed with slot, tier and personality
bot_fStrafeScale = 0;        // lateral movement NOT native-verified: keep 0

// --- legacy pulse knobs (inactive while bot_bHumanAI = 1) ----------------
bot_fFirePeriod = 1;
bot_iFireTicks = 3;
