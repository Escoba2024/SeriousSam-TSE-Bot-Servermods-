// Phase4Ai.ini - Phase-4-KI-Modus: automatische Zielwahl + Waffenwahl.
// Erst verwenden, wenn Phase 2 (und fuer Fleet-Betrieb Phase 3) abgenommen ist.
// Ablage: <Bot-Client>\Scripts\Phase4Ai.ini
// Start:  SeriousSam.exe +connect <ip>:25600 +quickjoin +script Scripts\Phase4Ai.ini
//
// Der KI-Modus liest NUR replizierte Spieler-Snapshots (Position/Health) und
// erzeugt weiterhin ausschliesslich normale Actions. Es gibt KEINE Sichtlinien-
// oder Kollisionspruefung; der Waypoint-Graph ist nur ein Stuck-Fallback und
// muss pro Map von Hand gepflegt werden (BotWaypoints.sample.txt).

bot_bEnabled = 1;
bot_ctLocalPlayers = 2;
bot_iProfileBase = 0;
bot_bVariants = 1;

bot_iAiMode = 1;        // 1 = naechstes lebendes Ziel + Waffenwahl nach Distanzband
bot_bTargetLocals = 0;  // eigene lokale Bots nicht anvisieren (1 nur fuer isolierte 2-Bot-Tests)
// bot_strWaypoints = "Scripts\\BotWaypoints.txt";  // optional, pro Map anpassen

bot_fYawSpeed = 90;     // schnellere Zielaufschaltung im KI-Modus
bot_fMoveFactor = 1.0;
bot_fFirePeriod = 1.0;
bot_iFireTicks = 3;
bot_iLogEvery = 20;
bot_bDiagnostics = 1;
