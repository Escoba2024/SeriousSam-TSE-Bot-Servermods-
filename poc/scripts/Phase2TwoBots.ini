// Phase2TwoBots.ini - Phase-2-Smoke-Test: 2 lokale Bots in EINEM Bot-Client.
// Ablage: <Bot-Client>\Scripts\Phase2TwoBots.ini
// Start:  SeriousSam.exe +connect <ip>:25600 +quickjoin +script Scripts\Phase2TwoBots.ini
//
// VORAUSSETZUNG: Im Bot-Client existieren mindestens 2 Spielerprofile
// (Profilindex 0 und 1) mit eigenen Namen, z. B. TSE_Bot_A / TSE_Bot_B.
// Jedes Profil traegt eine eigene Character-GUID - das ist der geforderte
// Eindeutigkeitsnachweis (TESTPROTOKOLL-PHASE-2.md, Pflichttest 2).

bot_bEnabled = 1;       // Master-Schalter
bot_ctLocalPlayers = 2; // Phase 2: zwei lokale Spieler ueber den nativen Split-Screen-Joinpfad
bot_iProfileBase = 0;   // Profile 0..1
bot_bVariants = 1;      // pro Slot eigener Heading-Offset + Yaw-Faktor (keine Gleichschritt-Bots)

bot_fYawSpeed = 45;     // Grad/s Basisdrehrate
bot_fMoveFactor = 1.0;  // Anteil an plr_fSpeedForward
bot_fFirePeriod = 1.0;  // Feuerpuls-Periode in Sekunden
bot_iFireTicks = 3;     // Feuerpuls-Laenge in Ticks
bot_iLogEvery = 20;     // Status-Log pro Bot jede Sekunde
bot_bDiagnostics = 1;   // [BotSnapshot]-Zeilen fuer Test-Phase2MultiBot.ps1
