// Phase6Presence.ini - Phase-6-Zusatz: niederfrequenter, gejitterter Chat.
// Wird ZUSAETZLICH zu einer Phase-2/4-Konfiguration geladen oder deren Werte
// hier gesetzt. Join-/Leave-Verzoegerungen steuert der Population Manager
// (Manage-BotPopulation.ps1), nicht der BotDriver.
// Ablage: <Bot-Client>\Scripts\Phase6Presence.ini

bot_bEnabled = 1;
bot_ctLocalPlayers = 2;
bot_iProfileBase = 0;
bot_bVariants = 1;
bot_iAiMode = 1;

bot_fChatPeriod = 180;  // Basisperiode in Sekunden; real gejittert +/-50 %
bot_strChatFile = "Scripts\\BotChatLines.txt";  // Kopie von ChatLines.sample.txt
bot_iChatSeed = 7;      // pro Instanz aendern, damit Muster nie identisch sind

bot_fYawSpeed = 90;
bot_fMoveFactor = 1.0;
bot_fFirePeriod = 1.0;
bot_iFireTicks = 3;
bot_iLogEvery = 20;
bot_bDiagnostics = 1;
